        --muted: #b9aa98;
        --font-display: "Fraunces", Georgia, serif;
        --font-text: "Bricolage Grotesque", "Mukta", sans-serif;
        --font-deva: "Mukta", "Bricolage Grotesque", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--color-ground); }

      /* shared look, used by every scene */
      .ground { position: absolute; inset: 0; background: var(--color-ground); overflow: hidden; }
      .ground .key {
        position: absolute; left: -380px; top: -520px; width: 1500px; height: 1500px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(245, 184, 61, 0.22), rgba(245, 184, 61, 0));
      }
      .ground .counter { position: absolute; left: 0; right: 0; top: 820px; bottom: 0; background: #120d0b; border-top: 1px solid rgba(255, 230, 200, 0.1); }
      .flood { position: absolute; inset: 0; }
      .display {
        font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; line-height: 1.02;
        font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 144; color: var(--color-ink);
      }
      .text { font-family: var(--font-text); font-weight: 500; font-size: 32px; line-height: 1.3; color: var(--muted); }
      .deva { font-family: var(--font-deva); font-weight: 600; }
      .word { display: inline-block; }
      .ui { display: block; border-radius: 34px; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55); }
      .phone { display: block; border-radius: 44px; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6), 0 0 0 8px #0d0907, 0 0 0 9px rgba(255, 230, 200, 0.14); }
      .bubble {
        position: absolute; left: 192px; top: 150px; width: 600px; padding: 34px 38px 32px;
        background: #fff4e2; border-radius: 34px; transform-origin: 30% 100%;
      }
      .bubble::after {
        content: ""; position: absolute; left: 150px; bottom: -26px; width: 56px; height: 56px;
        background: #fff4e2; border-radius: 0 0 14px 0; transform: rotate(45deg) skew(10deg, 10deg);
      }
      .bubble .display { color: #1a1411; font-size: 64px; }
      .bubble .text { color: #5b4a3d; margin-top: 12px; }

    </style>
